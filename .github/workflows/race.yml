name: Race Accessibility Review

# Triggered when someone comments "/race" on an issue or pull request.
# Flow:  issue_comment  ->  this workflow  ->  scripts/race-review.mjs
#        ->  WCAG review engine  ->  GitHub API posts the result back.
on:
  issue_comment:
    types: [created]

# Least-privilege token: write comments on issues/PRs.
permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  race-review:
    # Only run when the comment actually contains the /race command.
    if: ${{ contains(github.event.comment.body, '/race') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Acknowledge the command
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/reactions" \
            -d '{"content":"eyes"}' || true

      - name: Run the Race accessibility review (GitHub Copilot)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Fine-grained PAT with Copilot Requests permission, or a Copilot editor OAuth token.
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COPILOT_MODEL: ${{ vars.RACE_COPILOT_MODEL || 'gpt-4o' }}
          # Optional: central dataset URL so every repo reviews against one shared dataset.
          SHARED_DATASET_URL: ${{ vars.RACE_SHARED_DATASET_URL }}
        run: node scripts/race-review.mjs