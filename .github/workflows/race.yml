name: Race Accessibility Review

# Triggered when someone comments "/race" on an issue or pull request.
# Flow:  issue_comment  ->  this workflow  ->  scripts/race-review.mjs
#        ->  WCAG review engine  ->  GitHub API posts the result back.
on:
  issue_comment:
    types: [created]

# Least-privilege token: write comments on issues/PRs, read GitHub Models for the LLM.
permissions:
  issues: write
  pull-requests: write
  models: read
  contents: read

jobs:
  race-review:
    # Only run when the comment actually contains the /race command.
    if: ${{ contains(github.event.comment.body, '/race') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Acknowledge the command
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/reactions" \
            -d '{"content":"eyes"}' || true

      - name: Run the Race accessibility review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # LLM configuration. Defaults to GitHub Models (keyless, uses GITHUB_TOKEN).
          # To use OpenAI/Azure instead, set MODEL_ENDPOINT + MODEL_NAME and add an
          # OPENAI_API_KEY secret mapped to MODEL_TOKEN below.
          MODEL_NAME: ${{ vars.RACE_MODEL_NAME || 'openai/gpt-4o' }}
          MODEL_ENDPOINT: ${{ vars.RACE_MODEL_ENDPOINT }}
          MODEL_TOKEN: ${{ secrets.RACE_MODEL_TOKEN }}
          # Optional: point every repo at one central dataset for parallel, consistent reviews.
          SHARED_DATASET_URL: ${{ vars.RACE_SHARED_DATASET_URL }}
          # Set the repository variable RACE_DISABLE_AI to "1" to force the offline heuristic.
          DISABLE_AI: ${{ vars.RACE_DISABLE_AI }}
        run: node scripts/race-review.mjs
